services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      - production=True
      - DB_PATH=/app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "8280:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
