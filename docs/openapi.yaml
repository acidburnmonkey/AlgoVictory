openapi: 3.0.0
info:
  title: AlgoVictory API
  version: 0.1.0
  description: |
    HTTP API for AlgoVictory. The service is a Django 5 + Django REST Framework application
    that issues JWTs via SimpleJWT, supports Google and Twitter sign-in through django-allauth. 
servers:
  - url: http://127.0.0.1:8000
    description: Local development
  - url: http://localhost:8000
    description: Local development (localhost)
tags:
  - name: Auth
    description: Account creation and JWT lifecycle
  - name: Users
    description: Authenticated user profile access
  - name: Allauth Providers
    description: Social login flow via django-allauth and the subsequent session-to-JWT exchange
  - name: Sports
    description: UFC events and fighter data
  - name: Payments
    description: Stripe checkout and webhook for premium membership
paths:
  /api/user/register/:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a user account using a username, email, and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
            examples:
              default:
                summary: Basic registration
                value:
                  username: janedoe
                  email: jane@example.com
                  password: Passw0rd!
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/token/:
    post:
      tags: [Auth]
      summary: Login end point
      description: Exchanges username and password for a token pair using SimpleJWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainRequest'
            examples:
              password-login:
                summary: Password login
                value:
                  username: janedoe
                  password: Passw0rd!
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/token/refresh/:
    post:
      tags: [Auth]
      summary: Refresh an access token
      description: Exchanges a valid refresh token for a new access token. Refresh tokens expire after 1 day.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            examples:
              refresh:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user-info/:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      description: Returns profile data for the currently authenticated user.
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/social-token/:
    get:
      tags: [Auth, Allauth Providers]
      summary: Exchange a social session for JWTs
      description: |
        `LOGIN_REDIRECT_URL` in Django settings points to this endpoint (`/api/social-token/`).
        After django-allauth finishes the provider login and sets the user session, the
        browser is redirected here. The view requires the authenticated session (no
        direct API clients) and converts it into SimpleJWT access and refresh tokens,
        then redirects to the configured frontend URL (`FRONTEND_URL`) with `access`
        and `refresh` tokens in the query string.

        If the session is missing or expired, a 401 JSON error is returned. This endpoint
        is intended only as an internal redirect target; callers should not hit it
        directly without first completing the social login.
      responses:
        '302':
          description: Redirect to the frontend with `access` and `refresh` query params
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]

  /accounts/google/login/:
    get:
      tags: [Auth, Allauth Providers]
      summary: Start Google OAuth2 login (redirect)
      description: |
        Frontend initiates Google sign-in by calling this django-allauth endpoint.
        It responds with a 302 redirect to Google's OAuth consent screen. After a
        successful grant, allauth returns the browser to `LOGIN_REDIRECT_URL`
        (`/api/social-token/`) where the session is exchanged for JWTs.
      security: []
      responses:
        '302':
          description: Redirects the browser to Google OAuth consent

  /accounts/twitter/login/:
    get:
      tags: [Auth, Allauth Providers]
      summary: Start Twitter OAuth1 login (redirect)
      description: |
        Frontend initiates Twitter (OAuth1) sign-in by calling this django-allauth
        endpoint. It responds with a 302 redirect to Twitter's OAuth authorization screen.
        After authorization, allauth returns the browser to `/api/social-token/` to
        convert the authenticated session into JWTs.
      security: []
      responses:
        '302':
          description: Redirects the browser to Twitter OAuth1 authorization

  /api/reset-password/:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Validates the email against existing accounts and triggers allauth's
        password reset flow, which sends an email containing a uid and token.
        The email links to `FRONTEND_URL/reset-password/{uid}/{key}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              default:
                summary: Request password reset
                value:
                  email: jane@example.com
      responses:
        '200':
          description: Reset email sent (always returns 200 to avoid email enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        '400':
          description: Validation error (invalid email format or no account found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/set-password/:
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      description: |
        Accepts the base36-encoded uid and token from the password reset email
        along with a new password. The uid is decoded to look up the user, and
        the token is verified using allauth's `PASSWORD_RESET_TOKEN_GENERATOR`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
            examples:
              default:
                summary: Set new password
                value:
                  uid: c
                  key: d5abr1-9c71a70ebbe989ddcf059bfb7417b628
                  password: NewPassw0rd!
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: string
                required: [ok]
        '400':
          description: Invalid or expired token, or validation error (password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sports/show-events/:
    get:
      tags: [Sports]
      summary: List all UFC events
      description: Returns all stored upcoming UFC events.
      security: []
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpcomingEvent'

  /payments/stripe-pay/:
    post:
      tags: [Payments]
      summary: Create a Stripe checkout session
      description: |
        Creates a Stripe Checkout Session for a one-time $5.00 USD membership
        payment. On success, Stripe redirects the user to
        `FRONTEND_URL/payments/success/`; on cancel, to
        `FRONTEND_URL/payments/cancel/`. The session `metadata` carries the
        authenticated user's ID so the webhook can upgrade the account.
      responses:
        '200':
          description: Checkout session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Stripe-hosted checkout URL the client should redirect to
                required: [url]
              examples:
                default:
                  value:
                    url: https://checkout.stripe.com/pay/cs_test_...
        '200 (error)':
          description: Stripe authentication failure (API key missing/invalid)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/stripe-webhook/:
    post:
      tags: [Payments]
      summary: Stripe webhook receiver
      description: |
        Receives signed webhook events from Stripe. The signature is verified
        using the `Stripe-Signature` header and `STRIPE_WEBHOOK_SECRET`.

        On a `checkout.session.completed` event the user identified by
        `session.metadata.user_id` is upgraded to premium:
        - `premium` → `true`
        - `payment_date` → current UTC timestamp
        - `payment_expires` → `payment_date + 1 month`

        Any other event type is silently acknowledged with 200.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC signature provided by Stripe for payload verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event object (see Stripe docs)
      responses:
        '200':
          description: Event acknowledged
        '400':
          description: Invalid payload or signature verification failed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegistrationRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
      required: [id, username, email]

    UserInfo:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            provider:
              type: string
              description: Authentication provider identifier (`google` or `local`).
            avatar:
              type: string
              format: uri
              nullable: true
            premium:
              type: boolean
              default: false
            payment_date:
              type: string
              format: date-time
              nullable: true
            payment_expires:
              type: string
              format: date-time
              nullable: true

    TokenObtainRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    TokenPair:
      type: object
      required: [refresh, access]
      properties:
        refresh:
          type: string
        access:
          type: string

    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string

    TokenRefreshResponse:
      type: object
      required: [access]
      properties:
        access:
          type: string

    ResetPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    SetPasswordRequest:
      type: object
      required: [uid, key, password]
      properties:
        uid:
          type: string
          description: Base36-encoded user primary key
        key:
          type: string
          description: Password reset token generated by allauth
        password:
          type: string
          format: password
          minLength: 4
          description: New password (must be longer than 3 characters)

    UpcomingEvent:
      type: object
      properties:
        id:
          type: integer
        active:
          type: boolean
        dateTime:
          type: string
          example: 'April 12, 2026'
        day:
          type: string
          example: 'April 12, 2026'
        eventId:
          type: integer
        leagueId:
          type: integer
        name:
          type: string
        season:
          type: integer
        shortName:
          type: string
        status:
          type: string
      required: [id, active, dateTime, day, eventId, leagueId, name, season, shortName, status]

    Error:
      type: object
      properties:
        detail:
          type: string
      required: [detail]

security:
  - bearerAuth: []
